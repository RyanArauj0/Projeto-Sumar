<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Administração</title>
    <link rel="stylesheet" href="styles/painel.css">
</head>
<body>
    <div class="admin-panel">
        <h1>Painel de Administração</h1>
        
        <div class="add-car">
            <h2>Adicionar ou Editar Carro</h2>
            <form id="carForm">
                <input type="hidden" id="carIndex">
                <input type="text" id="carName" placeholder="Nome do Carro" required>
                <input type="text" id="carBrand" placeholder="Marca" required>
                <input type="number" id="carPrice" placeholder="Preço" required>
                <input type="url" id="carImage" placeholder="URL da Imagem" required>
                <textarea id="carDescription" placeholder="Descrição" required></textarea>
                <label>
                    Em estoque:
                    <input type="checkbox" id="carInStock">
                </label>
                <button type="submit">Salvar</button>
            </form>
        </div>

        <div class="car-list">
            <h2>Carros Cadastrados</h2>
            <ul id="carList"></ul>
        </div>
    </div>

    <script src="painel.js"></script>
</body>
</html>
