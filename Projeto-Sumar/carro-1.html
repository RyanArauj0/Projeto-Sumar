</head>

<body>
<header>
    <div class="interface">

        <h1>LOGO</h1>

        <nav class="menu-desktop">
            <ul>
                <li><a href="index.html">INÍCIO</a></li>
                <li><a href="carros.html" id="link-carros">CARROS</a></li>
                <li><a href="#">FINANCIE</a></li>
                <li><a href="#">VENDA SEU CARRO</a></li>
            </ul>
        </nav><!--nav-->

        <div id="btn-menu" class="abrir-menu">
            <i class="bi bi-list"></i>
        </div>

        <div class="btn-contato">
            <a href="#">
                <button>Contato</button>
            </a>
        </div><!-- btn-contato -->
        
        <button id="modo-toggle">🌙</button>
        
        <div id="menu-mobile" class="menu-mobile">
            <div class="btn-fechar" div="btn-fechar">
                <i class="bi bi-x-lg"></i>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">INÍCIO</a></li>
                    <li><a href="carros.html">CARROS</a></li>                   
                    <li><a href="#">FINANCIE</a></li>

                </ul>
            </nav><!--nav-->

        </div><!-- FIM DO MENU MOBILE -->
        <div id="overlay-menu" class="overlay-menu"></div>
    </div><!-- interface -->
</header><!-- fim do header -->
<div class="det-carros">
    
    <section class="slider">
        <div class="slider-content">
            <div class="slide-box primeiro" id="carro1-inicio"></div>

            <div class="slide-box" id="carro2-inicio">
                
            </div>

            <div class="slide-box" id="carro3-inicio">
                
            </div>
        </div>
        <div class="nav-buttons">
            <button onclick="prevSlide()">&#10094;</button>
            <button onclick="nextSlide()">&#10095;</button>
        </div>
    </section>

    <div id="detalhes-carro">
        
        <div class="desc">
            <h1>Nome do carro</h1>
            <ul>
                <li>Cambio: Automático</li><br>
                <li>Chave reserva: <span class="sim-nao">Não</span></li><br> <!-- Chave reserva sim/nao -->
                <li>Ano: </li><br>
                <li>Combustível:</li><br>
                <li>Km:</li>
            </ul>
            
            
        </div>

        <form>
            <h1>Fale conosco</h1>
            <input type="text" name="nome" id="nome" placeholder="Digite seu nome" autocomplete="off" required>

            <input type="email" name="email" id="email" placeholder="Informe seu e-mail" autocomplete=off required>

            <input type="tel" name="tel" id="tel" placeholder="Insira seu telefone" autocomplete=off required>

            <textarea id="mensagem" name="mensagem" rows="5" placeholder="Digite sua Proposta" required></textarea>

            <button type="submit">Enviar</button>
        </form>
        
    </div>
    
</div>

    <div class="interface">
        <div class="line-footer">
            <div class="flex">
                <div class="logo-footer">
                    <img class="logo" src="#" alt="Logo">
                </div><!-- fim da logo-footer -->
                <div class="btn-social">
                    <a href="#"><button class="icon-footer"><i class="bi bi-instagram"></i></button></a>
                        <a href="#" target="_blank"><button class="icon-footer"><i class="bi bi-whatsapp"></i></button></a>
                    <a href="#"><button class="icon-footer"><i class="bi bi-facebook"></i></button></a>
                </div><!-- fim do btn-social -->
            </div><!-- fim do flex -->
        </div><!-- fim line-footer -->

        <div class="line-footer borda" id="icon-email">
            <p><i class="bi bi-envelope-fill"></i> Desenvolvido por: <a href="mailto:d3v.araujo@gmail.com">Ryan Araújo.</a></p>
        </div>
    </div>
</footer>
<script src="scripts/script.js"></script>
